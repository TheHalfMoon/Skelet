name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skelet-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install pinned CI dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: --requirement requirements-ci.txt

      - name: Verify exact HEAD and repository hygiene
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_hygiene.py --expected-head "$EXPECTED_HEAD"

      - name: Compile bootstrap Python
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate upstream provenance lock
        run: python scripts/validate_upstreams.py

  graft:
    name: graft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js for pinned Graft
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Build Graft context graph
        run: npx --yes @nanonets/graft@0.21.1 build --no-gitignore --no-ignore .

      - name: Verify Graft freshness
        run: npx --yes @nanonets/graft@0.21.1 check .

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web application
        run: pnpm --dir apps/web lint

      - name: Strict typecheck
        run: pnpm --dir apps/web typecheck

      - name: Run Node.js tests
        run: node --experimental-strip-types --test "tests/node/*.test.mjs" "apps/web/tests/*.test.mjs" "apps/worker/tests/*.test.mjs"

      - name: Production build
        run: pnpm --dir apps/web build

      - name: Production startup smoke
        run: node scripts/smoke-web.mjs 3103

  worker:
    name: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint worker
        run: pnpm --dir apps/worker lint

      - name: Strict typecheck
        run: pnpm --dir apps/worker typecheck

      - name: Run worker tests
        run: node --experimental-strip-types --test "apps/worker/tests/*.test.mjs"

      - name: Worker health command
        run: pnpm --dir apps/worker start health

  monet-screenshot-queue:
    name: monet-screenshot-queue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Typecheck the isolated donor module
        run: >-
          npx --yes --package=typescript@5.9.3 tsc
          --noEmit --strict --target ES2022
          --module NodeNext --moduleResolution NodeNext
          packages/providers/monet/screenshot/queue.ts

      - name: Run Node.js queue contract tests
        run: node --experimental-strip-types --test tests/node/monet-screenshot-queue.test.mjs
